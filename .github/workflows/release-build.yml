name: Generate Release Version

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build:
    name: Build Release APK
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Latest Build Tools
        run: |
          build_tools_list=$(sdkmanager --list | sed -n 's/.*\(build-tools;[0-9.][0-9.a-zA-Z-]*\).*/\1/p')
          stable_build_tools_list=$(echo "$build_tools_list" | grep -v "\-rc")
          latest_stable_version=$(echo "$stable_build_tools_list" | sort -V | tail -n 1)
          latest_version_number=$(echo $latest_stable_version | sed 's/.*;//')
          sdkmanager "$latest_stable_version"
          echo "$ANDROID_SDK_ROOT/build-tools/$latest_version_number" >> $GITHUB_PATH

      - name: Verify Launcher Icon Resources
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "app/src/main/res/mipmap-${density}/ic_gpt_mobile.png"
            test -f "app/src/main/res/mipmap-${density}/ic_gpt_mobile_round.png"
            test -f "app/src/main/res/mipmap-${density}/ic_gpt_mobile_foreground.png"
            test -f "app/src/main/res/mipmap-${density}/ic_gpt_mobile_monochrome.png"
          done
          if grep -R -- '@drawable/ic_gpt_mobile_foreground' app/src/main/res/mipmap-anydpi-v26; then
            echo "Adaptive icons must use the provided density PNG foreground resources."
            exit 1
          fi
          if [ -e app/src/main/res/drawable/ic_gpt_mobile_foreground.xml ] || [ -e app/src/main/res/drawable/ic_gpt_mobile_monochrome.xml ]; then
            echo "Launcher foreground vectors must not be reintroduced."
            exit 1
          fi
          if [ -e app/src/main/res/mipmap-anydpi/ic_gpt_mobile.xml ] || [ -e app/src/main/res/mipmap-anydpi/ic_gpt_mobile_round.xml ]; then
            echo "Launcher fallback must use density PNGs, not anydpi vectors."
            exit 1
          fi
          if ! grep -q -- '@mipmap/ic_gpt_mobile_foreground' app/src/main/res/mipmap-anydpi-v26/ic_gpt_mobile.xml; then
            echo "Adaptive icon foreground must reference @mipmap/ic_gpt_mobile_foreground."
            exit 1
          fi
          if ! grep -q -- '<color name="ic_gpt_mobile_background">#FBF8F2</color>' app/src/main/res/values/ic_gpt_mobile_background.xml; then
            echo "Launcher icon background must stay #FBF8F2 on main."
            exit 1
          fi
          if grep -R -- 'Theme.SplashScreen.IconBackground' app/src/main/res/values app/src/main/res/values-night; then
            echo "Splash screen must not add a second icon background."
            exit 1
          fi
          if grep -R -- 'windowSplashScreenIconBackgroundColor' app/src/main/res/values app/src/main/res/values-night; then
            echo "Splash icon background color must stay unset."
            exit 1
          fi
          if grep -R -- '@color/ic_gpt_mobile_background' app/src/main/res/values/themes.xml app/src/main/res/values-night/themes.xml; then
            echo "Splash background must use the app surface color, not the launcher icon background."
            exit 1
          fi

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      - name: Build Unsigned Release App Bundle
        run: ./gradlew bundleRelease

      - name: Generate Signing Key
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE }}
        run: |
          echo $KEYSTORE_B64 | base64 -d > keystore.jks
          cp keystore.jks ${{ github.workspace }}/app/build/outputs/bundle/release/keystore.jks
        working-directory: ${{ github.workspace }}/app/build/outputs/apk/release

      - name: Sign Release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          apksigner sign --ks keystore.jks --alignment-preserved true --ks-pass env:SIGNING_PASSWORD --out app-release.apk app-release-unsigned.apk
        working-directory: ${{ github.workspace }}/app/build/outputs/apk/release

      - name: Sign Release App Bundle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore keystore.jks -keypass $SIGNING_PASSWORD -storepass $SIGNING_PASSWORD app-release.aab $SIGNING_KEY_ALIAS
        working-directory: ${{ github.workspace }}/app/build/outputs/bundle/release

      - name: Create Job Summary
        run: |
          unsigned_hash=$(md5 -q ./apk/release/app-release-unsigned.apk)
          signed_hash=$(md5 -q ./apk/release/app-release.apk)
          signed_aab_hash=$(md5 -q ./bundle/release/app-release.aab)
          certificate_hash=$(apksigner verify --print-certs ./apk/release/app-release.apk | grep "SHA-256" | awk -F': ' '{print $2}')
          echo "### Release Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Unsigned APK md5**: \`$unsigned_hash\`" >> $GITHUB_STEP_SUMMARY
          echo "**Signed APK md5**: \`$signed_hash\`" >> $GITHUB_STEP_SUMMARY
          echo "**Signed AAB md5**: \`$signed_aab_hash\`" >> $GITHUB_STEP_SUMMARY
          echo "**Certificate SHA-256**: \`$certificate_hash\`" >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ github.workspace }}/app/build/outputs

      - name: Upload Signed APK
        uses: actions/upload-artifact@v7
        id: artifact-upload-step
        with:
          name: release-${{ github.sha }}
          path: |
            ${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk
            ${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab
